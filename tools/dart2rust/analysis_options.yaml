# The compiler had no analysis options for its first 51k lines, which meant
# no analyzer at all: `dart analyze` resolves through the package config of
# the directory it runs in, and there was none (see `bin/devsetup.py`).
#
# The rules here are the ones that catch what this codebase has actually been
# bitten by, and nothing that would only reformat it -- `dart format` already
# owns layout, and a wall of style warnings would hide the real ones.
analyzer:
  errors:
    # A `switch` over the IR's node kinds that has grown a case is a bug, not
    # a style question.
    missing_return: error
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - testdata/**
    - target/**

linter:
  rules:
    # Implicit `dynamic` from a bad annotation is how a type hole starts.
    - avoid_returning_null_for_void
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    - iterable_contains_unrelated_type
    - list_remove_unrelated_type
    - no_duplicate_case_values
    - prefer_void_to_null
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps
